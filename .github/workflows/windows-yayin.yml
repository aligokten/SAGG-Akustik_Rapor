# Windows kurulum dosyasını (.exe) üretir ve GitHub Releases'e yayınlar.
#
# Neden bir Windows koşucusu? NSIS kurulum sihirbazı ve imzalanabilir bir .exe
# ancak Windows üzerinde güvenilir biçimde üretilir. GitHub'ın ücretsiz
# `windows-latest` koşucusu bunu her push'ta yapar.
#
# Yayın ölçütü: `package.json` içindeki SÜRÜM NUMARASI. Sürüm artırılmadan
# yapılan push'lar yalnızca test edilir, yeni sürüm yayınlanmaz. Sürüm
# artırıldığında iş akışı kendiliğinden:
#   1. `v<sürüm>` etiketini bu commit'e atar,
#   2. kurulum .exe'sini derler,
#   3. .exe ile birlikte otomatik güncelleme beslemesi olan `latest.yml`
#      dosyasını Releases'e yükler.
# Uygulama içindeki electron-updater bu `latest.yml` dosyasını okuyarak
# kullanıcıyı güncellemeye yönlendirir.
name: Windows kurulum dosyası yayını

on:
  push:
    branches: [claude/ks-schallschutzrechner-turkish-lgtwfl, main]
  workflow_dispatch:
    inputs:
      zorla:
        description: 'Sürüm zaten yayınlanmış olsa da yeniden derle ve yükle'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-yayin
  cancel-in-progress: false

jobs:
  hazirlik:
    name: Sürüm denetimi
    runs-on: ubuntu-latest
    outputs:
      surum: ${{ steps.bilgi.outputs.surum }}
      yayinla: ${{ steps.bilgi.outputs.yayinla }}
    steps:
      - uses: actions/checkout@v4
      - id: bilgi
        env:
          GH_TOKEN: ${{ github.token }}
          ZORLA: ${{ inputs.zorla }}
        run: |
          SURUM=$(node -p "require('./package.json').version")
          echo "surum=$SURUM" >> "$GITHUB_OUTPUT"
          if [ "$ZORLA" = "true" ]; then
            echo "Zorlama istendi → yayınlanacak."
            echo "yayinla=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$SURUM" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$SURUM zaten yayınlanmış → yalnızca test edilecek."
            echo "yayinla=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$SURUM henüz yayınlanmamış → yayınlanacak."
            echo "yayinla=true" >> "$GITHUB_OUTPUT"
          fi

  testler:
    name: Hesap çekirdeği testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test test/*.test.js

  kurulum:
    name: Kurulum .exe derle ve yayınla
    needs: [hazirlik, testler]
    if: needs.hazirlik.outputs.yayinla == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      # `npx electron-builder` YERİNE npm betiği: npx, komutu çözerken çalışma
      # dizinini de tarar ve Windows'ta `.JS` varsayılan olarak PATHEXT
      # içindedir. Yapılandırma dosyası `electron-builder.js` adını taşırken
      # kabuk komut yerine bu dosyayı çalıştırıyor, araç hiç koşmuyordu:
      # çıktı yok, hata yok, exit 0 — yani iş sessizce boş geçiyordu. Dosya
      # artık `.mjs`, çağrı da doğrudan node_modules/.bin üzerinden yapılıyor.
      - name: Kurulum dosyasını derle ve Releases'e yükle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run yayinla

      # Dosyaların diskte üretilmiş olması YETMEZ: ilk denemede .exe ve
      # latest.yml diskte vardı ama Releases'e yüklenmemişti, iş yine de yeşil
      # geçmişti. Bu yüzden asıl denetim GitHub'daki sürüm kaydına bakar.
      # latest.yml eksikse otomatik güncelleme hiç çalışmaz — o hâlde iş
      # kırmızı düşmelidir.
      - name: Yayının Releases'e gerçekten ulaştığını doğrula
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SURUM: ${{ needs.hazirlik.outputs.surum }}
        run: |
          echo "dist/ içeriği:"; ls -la dist || true
          VARLIKLAR=$(gh release view "v$SURUM" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')
          echo "Sürümdeki dosyalar:"; echo "$VARLIKLAR"
          echo "$VARLIKLAR" | grep -qx "SAGG-Akustik-Hesap-Kurulum-$SURUM.exe" \
            || { echo "HATA: kurulum .exe'si Releases'e yüklenmemiş."; exit 1; }
          echo "$VARLIKLAR" | grep -qx "latest.yml" \
            || { echo "HATA: latest.yml yüklenmemiş — otomatik güncelleme çalışmaz."; exit 1; }

      - name: Kurulum dosyasını iş akışı çıktısı olarak da sakla
        uses: actions/upload-artifact@v4
        with:
          name: SAGG-Akustik-Hesap-Kurulum-${{ needs.hazirlik.outputs.surum }}
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
